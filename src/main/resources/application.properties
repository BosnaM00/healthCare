spring.application.name=healthCare

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mediconnect
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate  — never modifies schema; fails fast on mismatch (use in prod)
# update    — applies schema changes automatically       (safe for local dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Store all timestamps in UTC so LocalTime / Instant mapping is unambiguous
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate 6: use the new ID generation strategy for PostgreSQL UUIDs
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ── Quartz ────────────────────────────────────────────────────────────────────
# RAMJobStore for local dev — no extra tables needed.
# Switch to JDBC JobStoreTX in production for cluster-safe scheduling.
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true

# ── Stripe ────────────────────────────────────────────────────────────────────
# Replace with real keys from Stripe Dashboard before going live.
stripe.secret-key=sk_test_placeholder

# ── Encryption ────────────────────────────────────────────────────────────────
# AES-256 key: base64-encoded 32-byte random value.
# Generate with: openssl rand -base64 32
# In production, inject this from AWS Secrets Manager — never commit real keys.
app.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# ── Payment ───────────────────────────────────────────────────────────────────
app.payment.currency=ron
app.payment.default-consultation-fee=150.00
app.payment.independent-commission-rate=0.15

# ── JWT ───────────────────────────────────────────────────────────────────────
# HS256 secret: base64-encoded 32-byte random value.
# Generate with: openssl rand -base64 32
# In production, inject this from AWS Secrets Manager — never commit real keys.
app.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Token validity: 24 h (milliseconds)
app.jwt.expiration-ms=86400000
