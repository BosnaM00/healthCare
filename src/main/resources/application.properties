spring.application.name=healthCare

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate — never modifies schema; Flyway owns schema evolution
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Store all timestamps in UTC so LocalTime / Instant mapping is unambiguous
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate 6: use the new ID generation strategy for PostgreSQL UUIDs
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ── Flyway ────────────────────────────────────────────────────────────────────
# baseline-on-migrate=true treats the existing Hibernate-managed schema as version 0
# so V1+ migrations are applied cleanly on top of the already-running schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# Ignore migrations that exist in history but no longer have a file on disk.
# Required after removing the duplicate V1__stripe_schema_extensions.sql.
spring.flyway.ignore-migration-patterns=*:missing

# NOTE: spring.jpa.defer-datasource-initialization must stay OFF here.
# With Flyway owning the schema and ddl-auto=validate, enabling it makes Boot 4
# classify the EntityManagerFactory as a database initializer, which inverts the
# ordering so Hibernate validates BEFORE Flyway migrates. Leaving it unset lets
# the EMF depend on Flyway, so migrations run first (the intended order).

# ── Quartz ────────────────────────────────────────────────────────────────────
# JDBC JobStoreTX for cluster-safe scheduling; schema managed via Flyway V2.
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.auto-startup=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=MediConnectScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# ── Stripe ────────────────────────────────────────────────────────────────────
# All real keys come from environment variables — never committed to source control.
# Local dev: export STRIPE_API_KEY=sk_test_... STRIPE_WEBHOOK_SECRET=whsec_...
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.connect.return-url=${FE_BASE_URL:http://localhost:5173}/medic/onboarding?stripe_onboarding=complete
stripe.connect.refresh-url=${FE_BASE_URL:http://localhost:5173}/medic/onboarding?stripe_onboarding=refresh
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}

# ── Platform fee ──────────────────────────────────────────────────────────────
# Percentage-based fee expressed as 0–100 (e.g. 15 = 15%)
app.fee.independent-pct=15
app.fee.clinic-pct=10
# Optional fixed fee per transaction in bani (1 RON = 100 bani); 0 = no fixed fee
app.fee.fixed-bani=0

# ── Payment ───────────────────────────────────────────────────────────────────
app.payment.currency=ron
app.payment.default-consultation-fee=150.00
app.payment.independent-commission-rate=0.15
app.payment.dispute-window-minutes=120

# ── Encryption ────────────────────────────────────────────────────────────────
# AES-256 primary key: base64-encoded 32-byte random value.
# Fail-fast at startup if missing (see EncryptionService).
# Generate with: openssl rand -base64 32
app.encryption.key=${APP_ENCRYPTION_KEY_PRIMARY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
app.encryption.key-secondary=${APP_ENCRYPTION_KEY_SECONDARY:}

# ── JWT ───────────────────────────────────────────────────────────────────────
# HS256 secret: base64-encoded 32-byte random value.
app.jwt.secret=${APP_JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
# Token validity: 24 h (milliseconds)
app.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins (no trailing slash)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8172,http://localhost:3000}

# ── Feature flags ─────────────────────────────────────────────────────────────
# Default true in dev so new routes are exercisable; set false in prod until QA passes.
app.payments.stripe-enabled=${STRIPE_ENABLED:false}

# ── Video / Daily.co ──────────────────────────────────────────────────────────
# Set app.video.enabled=false in CI or staging until Daily keys are provisioned.
app.video.enabled=${VIDEO_ENABLED:false}
app.video.provider=daily
app.video.token-ttl=PT15M
app.video.max-room-ttl=PT2H

app.video.daily.api-base=https://api.daily.co/v1
# Real keys come from AWS Secrets Manager / env vars — never committed
app.video.daily.api-key=${DAILY_API_KEY:daily_placeholder}
app.video.daily.domain=${DAILY_DOMAIN:mediconnect.daily.co}
app.video.daily.region=eu-west
app.video.daily.webhook-secret=${DAILY_WEBHOOK_SECRET:daily_webhook_placeholder}

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# Client ID from Google Cloud Console (APIs & Services → Credentials).
# Used by GoogleIdTokenVerifier to validate the 'aud' claim in incoming ID tokens.
# Never commit the real value — always use an environment variable.
google.client.id=${GOOGLE_CLIENT_ID:59056556803-o0skbhh21i0dartpdd7fh3sca0c361f5.apps.googleusercontent.com}
